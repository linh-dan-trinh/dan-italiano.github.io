<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italiano per Dan</title>
<meta name="description" content="Launcher for Dan's private Italian study app.">
<meta name="theme-color" content="#fffaf0">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* This page only opens the private app on claude.ai: nothing private is stored here. */
  :root { --bg: #fffaf0; --ink: #13305a; --muted: #5f6b7d; --btn: #2f6db5; --line: #eadfca; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101826; --ink: #e8edf6; --muted: #9eabc0; --btn: #6ea4ea; --line: #2a3850; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right)); }
  main { display: grid; gap: 14px; justify-items: center; text-align: center; max-width: 360px; }
  img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  h1 { margin: 6px 0 0; font: 800 28px/1.1 Georgia, serif; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  a.btn { display: block; width: 100%; text-decoration: none; text-align: center; border-radius: 12px; padding: 14px 18px; font-weight: 700; }
  .main { background: var(--btn); color: #fff; }
  .alt { border: 1px solid var(--line); color: var(--ink); }
  @media (prefers-color-scheme: dark) { .main { color: #0d1626; } }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Italiano per Dan</h1>
  <p id="msg">Apro l'app…</p>
  <a class="btn main" id="open" href="https://claude.ai/artifact/WEg7tYh2oXF46P9idVhSwS">Apri l'app</a>
  <a class="btn alt" id="chrome" hidden href="intent://claude.ai/artifact/WEg7tYh2oXF46P9idVhSwS#Intent;scheme=https;package=com.android.chrome;end">Apri in Chrome (mic e voce)</a>
  <p>The app is private: it opens only with your Claude login.</p>
</main>
<script>
  const isAndroid = /android/i.test(navigator.userAgent);
  if (isAndroid) document.getElementById("chrome").hidden = false;
  // Open the app straight away once per launch; coming back here shows the buttons instead of looping.
  let first = true;
  try { first = !sessionStorage.getItem("opened"); sessionStorage.setItem("opened", "1"); } catch {}
  if (first) setTimeout(() => { location.href = document.getElementById("open").href; }, 400);
  else document.getElementById("msg").textContent = "Tocca per aprire.";
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
